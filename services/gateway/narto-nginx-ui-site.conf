# [narto] Site próprio no nginx-ui; não altera os sites/volumes existentes.
# [narto] O certificado é emitido pelo painel Bindnet com o nome narto.local.com.
server {
    listen 80;
    listen [::]:80;
    server_name narto.local.com;
    return 308 https://narto.local.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name narto.local.com;
    ssl_certificate /etc/nginx/ssl/narto.local.com/server.crt;
    ssl_certificate_key /etc/nginx/ssl/narto.local.com/server.key;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $narto_upstream http://main.frontend.narto.wnet:8080;
    client_max_body_size 1m;
    location / {
        proxy_pass $narto_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 55s;
    }
}
