# Cabecalhos de proxy comuns a todos os location do gateway.
# Arquivo separado (incluido com "include") em vez de repetido em cada
# bloco: sao seis diretivas identicas em cinco lugares, e divergir uma
# delas por engano quebraria so um dos caminhos - do jeito mais dificil
# de perceber.
#
# X-Forwarded-For e o critico: o backend descobre o MAC do dispositivo
# do hotspot a partir do IP de origem (resolvePortalMAC em
# services/backend/internal/hotspot/hotspot_portal_resolve.go).
# "$proxy_add_x_forwarded_for" ACRESCENTA o IP do salto anterior a
# cadeia ja existente, em vez de substituir - e o que preserva o IP do
# cliente atraves de nginx-ui -> gateway -> frontend/backend.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Upgrade/Connection via a variavel $connection_upgrade (mapeada no
# nginx.conf.template) e nao "Connection upgrade" fixo: com o valor
# fixo, TODA requisicao normal tambem pedia upgrade de protocolo, o que
# alguns upstreams rejeitam. O map devolve "close" quando nao ha
# upgrade real pedido pelo cliente.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
