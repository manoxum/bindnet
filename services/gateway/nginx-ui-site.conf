# Copia versionada do site "@" do nginx-ui (arquivo real em
# /etc/nginx/sites-available/@ dentro do volume bindnet_nginx_config,
# que NAO faz parte deste repositorio).
#
# O que mudou em relacao a versao anterior: os dois dominios apontavam
# direto para o frontend (http://10.91.0.1:9090) de forma IDENTICA.
# O frontend publica superficies distintas por hostname: portal na raiz
# de bindnet.local.com e administracao em admin.bindnet.local.com.
#
# Agora o nginx-ui so faz duas coisas: termina o TLS e entrega o
# trafego ao gateway pela rede wnet. O Host TEM que ser preservado: o
# gateway e o frontend usam esse dado para manter as superficies
# completamente separadas.
#
# main.gateway.bindnet.wnet e o alias declarado em
# docker-compose.services.yml (${STAGE:-main}.gateway.bindnet.wnet),
# resolvido pelo DNS interno do Docker na rede wnet - por isso o
# "resolver 127.0.0.11" e a resolucao em variavel: com o nome dentro de
# uma variavel, o nginx resolve em cada requisicao em vez de fixar o IP
# no arranque, e o gateway pode ser recriado (IP novo) sem derrubar o
# nginx-ui junto.

server {
    listen 80;
    listen [::]:80;
    server_name bindnet.local.com admin.bindnet.local.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $upstream_gateway http://main.gateway.bindnet.wnet;
    location / {
        proxy_pass $upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bindnet.local.com admin.bindnet.local.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $upstream_gateway http://main.gateway.bindnet.wnet;
    ssl_certificate /etc/nginx/ssl/bindnet.local.com/server.crt;
    ssl_certificate_key /etc/nginx/ssl/bindnet.local.com/server.key;
    location / {
        proxy_pass $upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
